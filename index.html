l<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTRP V6.3.8 - INSTANT BOOT</title>
    <style>
        :root { --nu: #820ad1; --wpp: #00a884; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        .smartphone { 
            width: 360px; height: 740px; 
            background-color: #111; 
            background-size: cover; 
            background-position: center;
            border: 12px solid #1a1a1a; 
            border-radius: 45px; 
            position: relative; 
            overflow: hidden; 
            align-self: center; 
        }
        
        .status-bar { position: absolute; top: 0; width: 100%; height: 35px; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; font-size: 12px; z-index: 10000; color: white; background: rgba(0,0,0,0.3); }
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; z-index: 10; padding-bottom: 60px; background: transparent; }
        .active { display: flex; }
        
        #sc-lock { justify-content: center; align-items: center; text-align: center; color: white; z-index: 1000; background: none !important; }
        #sc-lock h1 { font-size: 80px; font-weight: 300; text-shadow: 0px 4px 15px rgba(0,0,0,1); margin-bottom: 20px; }
        
        #sc-nu { background: #000 !important; overflow-y: auto; }
        #sc-tiger { background: #3d0202 !important; overflow-y: auto; }
        #sc-wpp { background: #111b21 !important; }
        #sc-set { background: #1c1c1e !important; overflow-y: auto; }

        .pin-container { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 15px; width: 200px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        #pin-field { width: 100%; background: transparent; border: none; color: white; font-size: 32px; text-align: center; letter-spacing: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 90px 15px; }
        .app { display: flex; flex-direction: column; align-items: center; color: white; font-size: 11px; font-weight: 600; text-align: center; text-shadow: 1px 1px 5px rgba(0,0,0,1); }
        .app img { width: 60px; height: 60px; border-radius: 14px; margin-bottom: 5px; }

        #total-win { text-align:center; font-size:24px; font-weight:900; height:40px; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
        .tiger-machine { display: flex; justify-content: center; gap: 10px; background: #ffcc00; padding: 15px; border-radius: 20px; border: 5px solid #cc0000; margin: 5px 15px; }
        .slot-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .val-unit { color: #fff; font-size: 12px; font-weight: bold; height: 15px; }
        .slot { width: 85px; height: 100px; background: #fff; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 45px; }
        .spinning { animation: spinMove 0.1s infinite linear; }
        @keyframes spinMove { 0% { transform: translateY(-2px); } 100% { transform: translateY(2px); } }

        .w-header { background: #202c33; padding: 40px 15px 15px; color: white; display: flex; align-items: center; gap: 15px; }
        .chat-win { position: absolute; inset: 0; background: #0b141a; display: none; flex-direction: column; z-index: 2000; padding-bottom: 60px; }
        .chat-msgs { flex: 1; padding: 15px; overflow-y: auto; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); display: flex; flex-direction: column; }
        .bbl { padding: 10px; margin: 5px 0; border-radius: 12px; max-width: 85%; color: white; font-size: 14px; }
        .sent { background: #005c4b; align-self: flex-end; }
        .recv { background: #202c33; align-self: flex-start; }
        .w-input-area { background: #202c33; padding: 10px; display: flex; align-items: center; gap: 8px; }
        .w-input { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 25px; color: white; }
        .w-btn { background: #00a884; border: none; width: 45px; height: 45px; border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; }
        
        .nu-card { background: #1c1c1e; margin: 12px; padding: 20px; border-radius: 15px; color: white; border: 1px solid #333; }
        .nu-input { width: 100%; padding: 14px; margin: 8px 0; background: #222; border: 1px solid #444; color: white; border-radius: 10px; }
        
        .nav-bar { position: absolute; bottom: 0; width: 100%; height: 50px; z-index: 1000000; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.5); }
        .bar-ios { width: 130px; height: 5px; background: #fff; border-radius: 10px; }
        .nav-android { width: 100%; display: none; justify-content: space-around; color: white; font-size: 22px; }
    </style>
</head>
<body>

<div class="smartphone" id="phone-body">
    <div class="status-bar"><span id="st-time">--:--</span><span>📶 🔋</span></div>

    <div id="sc-lock" class="screen active">
        <h1 id="lk-time">--:--</h1>
        <div class="pin-container"><input type="password" id="pin-field" maxlength="4" placeholder="PIN" oninput="GTR.checkPin(this.value)"></div>
    </div>

    <div id="sc-home" class="screen">
        <div class="grid">
            <div class="app" onclick="GTR.open('wpp')"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">WhatsApp</div>
            <div class="app" onclick="GTR.open('nu')"><img src="https://logodownload.org/wp-content/uploads/2019/08/nubank-logo-3.png" style="background:#fff; padding:5px">Nubank</div>
            <div class="app" onclick="GTR.open('tiger')"><img src="https://png.pngtree.com/png-clipart/20231014/original/pngtree-3d-tiger-cartoon-png-image_13303649.png" style="background:#ff9500;">Tigrinho</div>
            <div class="app" onclick="GTR.open('set')"><img src="https://cdn-icons-png.flaticon.com/512/563/563541.png">Ajustes</div>
        </div>
    </div>

    <div id="sc-tiger" class="screen">
        <div style="background:linear-gradient(#f00, #900); padding:45px 10px 5px; text-align:center; color:#ffcc00;"><h2>🐯 FORTUNE TIGER 🐯</h2></div>
        <div id="total-win"></div>
        <div class="tiger-machine">
            <div class="slot-col"><div id="v1" class="val-unit"></div><div class="slot" id="sl1">🐯</div></div>
            <div class="slot-col"><div id="v2" class="val-unit"></div><div class="slot" id="sl2">🐯</div></div>
            <div class="slot-col"><div id="v3" class="val-unit"></div><div class="slot" id="sl3">🐯</div></div>
        </div>
        <div style="padding:10px 20px;">
            <div class="nu-card" style="text-align:center; border-color:#ffcc00; margin:0; background: rgba(0,0,0,0.3);"><h2 id="tiger-banca" style="color:#ffcc00;">R$ 0,00</h2></div>
            <input type="number" step="0.01" id="bet-val" class="nu-input" placeholder="Aposta R$" style="text-align:center;">
            <button onclick="GTR.spin()" style="width:100%; height:60px; background:linear-gradient(#ff9500, #ffcc00); border:none; border-radius:18px; font-weight:900; font-size:22px;">GIRAR</button>
            <div style="display:flex; gap:10px; margin-top:10px;"><button onclick="GTR.tigerBank('dep')" style="flex:1; padding:12px; background:#ffcc00; border:none; border-radius:10px; font-weight:bold;">DEPÓSITO</button><button onclick="GTR.tigerBank('sac')" style="flex:1; padding:12px; background:#cc0000; color:white; border:none; border-radius:10px; font-weight:bold;">SAQUE</button></div>
        </div>
    </div>

    <div id="sc-wpp" class="screen"><div class="w-header"><b>WhatsApp</b></div><div id="contatos" style="flex:1; overflow-y:auto; background:#111b21;"></div><div id="chat-ui" class="chat-win"><div class="w-header"><span onclick="GTR.closeChat()" style="font-size:24px;">←</span> <b id="chat-n">Nome</b></div><div id="msgs" class="chat-msgs"></div><div class="w-input-area"><input type="text" id="w-msg" class="w-input" placeholder="Mensagem" oninput="GTR.wppBtn()"><button id="btn-audio" class="w-btn">🎤</button><button id="btn-send" class="w-btn" style="display:none;" onclick="GTR.sendMsg()">🚀</button></div></div></div>

    <div id="sc-nu" class="screen"><div style="background:var(--nu); padding:60px 20px 25px; color:white;">Olá, <b>Gustavo</b></div><div class="nu-card"><p style="color:#888;">Saldo disponível</p><h1 id="nu-saldo">R$ 0,00</h1><button onclick="GTR.togglePix()" style="width:100%; padding:15px; margin-top:15px; border-radius:12px; border:none; background:var(--nu); color:white; font-weight:bold;">💠 Área Pix</button></div><div id="pix-box" style="display:none; padding:0 12px;"><div class="nu-card"><input type="text" id="pix-dest" class="nu-input" placeholder="Destinatário"><input type="number" id="pix-val" class="nu-input" placeholder="Valor R$"><button onclick="GTR.doPix()" style="width:100%; padding:14px; background:#00ff00; border:none; border-radius:10px; font-weight:bold;">CONFIRMAR PIX</button></div></div><div id="nu-hist"></div></div>

    <div id="sc-set" class="screen"><div style="padding:60px 20px 10px; color:white;"><h2>Ajustes</h2></div><div class="nu-card"><p style="color:#888; font-size:12px;">NAV BAR:</p><div style="display:flex; gap:10px; margin-top:10px;"><button onclick="GTR.setNav('ios')" style="flex:1; padding:12px; background:#333; color:white; border-radius:8px;">iOS</button><button onclick="GTR.setNav('android')" style="flex:1; padding:12px; background:#333; color:white; border-radius:8px;">Android</button></div></div><div class="nu-card"><p style="color:#888; font-size:12px;">WALLPAPER URL:</p><input type="text" id="wall-url" class="nu-input" placeholder="Link da imagem"><button onclick="GTR.saveWall()" style="width:100%; padding:12px; background:#444; color:white; border:none; border-radius:10px;">Salvar Fundo</button></div><div class="nu-card"><p style="color:#888; font-size:12px;">SEGURANÇA:</p><input type="number" id="new-pin" class="nu-input" placeholder="Novo PIN 4 dígitos"><button onclick="GTR.savePin()" style="width:100%; padding:12px; background:var(--nu); color:white; border:none; border-radius:10px;">Mudar PIN</button></div></div>

    <div class="nav-bar" onclick="GTR.goHome()"><div id="n-ios" class="bar-ios"></div><div id="n-and" class="nav-android"><span>◁</span> ◯ <span>▢</span></div></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const config = { apiKey: "AIzaSyAKGxxEnAcvBc5D34B_P08pS_Y8H-v5A-Y", databaseURL: "https://meurp-celular-default-rtdb.firebaseio.com" };
    const db = getDatabase(initializeApp(config));

    window.GTR = {
        user: "Gustavo", pin: localStorage.getItem('gtr_pin') || "0000",
        realSaldo: 0, banca: 0, canSpin: true, alvo: "",

        startClock: () => {
            const up = () => {
                const d = new Date();
                const t = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
                if(document.getElementById('st-time')) document.getElementById('st-time').innerText = t;
                if(document.getElementById('lk-time')) document.getElementById('lk-time').innerText = t;
            };
            up(); setInterval(up, 1000);
        },

        checkPin: (v) => { if(v === GTR.pin) { GTR.open('home'); document.getElementById('pin-field').value = ""; } },
        savePin: () => { const p = document.getElementById('new-pin').value; if(p.length===4){ GTR.pin = p; localStorage.setItem('gtr_pin', p); alert("PIN Alterado!"); } },
        saveWall: async () => { const u = document.getElementById('wall-url').value; if(u) { await update(ref(db, `usuarios/${GTR.user}`), { wall: u }); alert("Salvo!"); } },
        open: (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); const target = document.getElementById('sc-'+id); if(target) target.classList.add('active'); },
        goHome: () => { GTR.open('home'); GTR.closeChat(); },
        setNav: (t) => { document.getElementById('n-ios').style.display = t==='ios'?'block':'none'; document.getElementById('n-and').style.display = t==='android'?'flex':'none'; },

        wppBtn: () => {
            const v = document.getElementById('w-msg').value;
            document.getElementById('btn-audio').style.display = v ? 'none' : 'flex';
            document.getElementById('btn-send').style.display = v ? 'flex' : 'none';
        },
        openChat: (n) => {
            GTR.alvo = n; document.getElementById('chat-n').innerText = n; document.getElementById('chat-ui').style.display='flex';
            onValue(ref(db, 'mensagens'), s => {
                const box = document.getElementById('msgs'); box.innerHTML = "";
                s.forEach(m => {
                    const d = m.val(); 
                    if((d.de===GTR.user && d.para===n) || (d.de===n && d.para===GTR.user)) {
                        let conteudo = d.tipo === 'audio' || d.url ? `<audio style="width:180px;filter:invert(1)" controls src="${d.url || d.txt}"></audio>` : d.txt || "...";
                        box.innerHTML += `<div class="bbl ${d.de===GTR.user?'sent':'recv'}">${conteudo}</div>`;
                    }
                }); box.scrollTop = box.scrollHeight;
            });
        },
        closeChat: () => document.getElementById('chat-ui').style.display='none',
        sendMsg: () => {
            const t = document.getElementById('w-msg').value;
            if(t) { push(ref(db, 'mensagens'), { de: GTR.user, para: GTR.alvo, txt: t, tipo: 'texto' }); document.getElementById('w-msg').value=""; GTR.wppBtn(); }
        },

        togglePix: () => { const b = document.getElementById('pix-box'); b.style.display = b.style.display==='none'?'block':'none'; },
        doPix: async () => {
            const v = parseFloat(document.getElementById('pix-val').value);
            const d = document.getElementById('pix-dest').value;
            if(v > 0 && GTR.realSaldo >= v) {
                await update(ref(db, `usuarios/${GTR.user}`), { saldo: GTR.realSaldo - v });
                await push(ref(db, `usuarios/${GTR.user}/historico`), { label: `Pix para ${d}`, val: -v });
                alert("Pix Enviado!"); GTR.togglePix();
            } else { alert("Saldo insuficiente!"); }
        },

        spin: () => {
            if(!GTR.canSpin) return;
            const bet = parseFloat(document.getElementById('bet-val').value);
            if(isNaN(bet) || bet <= 0) return alert("Aposta inválida!");
            if(bet > GTR.banca) return alert("Banca insuficiente!");
            GTR.canSpin = false; GTR.banca -= bet; document.getElementById('tiger-banca').innerText = "R$ " + GTR.banca.toFixed(2);
            const slots = [document.getElementById('sl1'), document.getElementById('sl2'), document.getElementById('sl3')];
            const vals = [document.getElementById('v1'), document.getElementById('v2'), document.getElementById('v3')];
            slots.forEach(s => { s.classList.add('spinning'); s.innerText = "🎰"; });
            setTimeout(async () => {
                const items = [{s:"💎", m:8.42, p:0.02}, {s:"🐯", m:3.15, p:0.04}, {s:"🦁", m:1.52, p:0.08}, {s:"🐒", m:0.64, p:0.15}, {s:"🍊", m:0.21, p:0.18}, {s:"🍇", m:0.09, p:0.20}, {s:"💀", m:-2.68, p:0.05}, {s:"🗑️", m:8.8, p:0.03}, {s:"❌", m:0, p:0.25}];
                let roundTotal = 0;
                slots.forEach((s, i) => {
                    s.classList.remove('spinning');
                    let sorte = Math.random(), cumul = 0, res = items[items.length-1];
                    for(let it of items){ cumul += it.p; if(sorte < cumul){ res = it; break; } }
                    let g = bet * res.m;
                    vals[i].innerText = (g >= 0 ? "+" : "") + g.toFixed(2);
                    vals[i].style.color = g >= 0 ? "#00ff00" : "#ff0000";
                    s.innerText = res.s; roundTotal += g;
                });
                GTR.banca += roundTotal; if (GTR.banca < 0) GTR.banca = 0;
                const winElem = document.getElementById('total-win');
                winElem.innerText = "GANHO: R$ " + roundTotal.toFixed(2);
                winElem.style.color = roundTotal >= bet ? "#00ff00" : "#ff0000";
                document.getElementById('tiger-banca').innerText = "R$ " + GTR.banca.toFixed(2);
                await update(ref(db, `usuarios/${GTR.user}`), { bancaTiger: GTR.banca });
                GTR.canSpin = true;
            }, 1000);
        },

        tigerBank: async (m) => {
            const v = parseFloat(prompt("Valor?"));
            if(v > 0) {
                let nS = GTR.realSaldo, nB = GTR.banca;
                if(m==='dep' && GTR.realSaldo >= v) { nS -= v; nB += v; }
                else if(m==='sac' && GTR.banca >= v) { nS += v; nB -= v; }
                else return alert("Saldo insuficiente!");
                await update(ref(db, `usuarios/${GTR.user}`), { saldo: nS, bancaTiger: nB });
                await push(ref(db, `usuarios/${GTR.user}/historico`), { label: m==='dep'?"Depósito Tiger":"Saque Tiger", val: m==='dep'?-v:v });
            }
        },

        init: () => {
            GTR.startClock();
            onValue(ref(db, `usuarios/${GTR.user}`), s => {
                const d = s.val() || { saldo: 0, bancaTiger: 0 };
                GTR.realSaldo = d.saldo; GTR.banca = d.bancaTiger;
                document.getElementById('nu-saldo').innerText = "R$ " + GTR.realSaldo.toFixed(2);
                document.getElementById('tiger-banca').innerText = "R$ " + GTR.banca.toFixed(2);
                if(d.wall) document.getElementById('phone-body').style.backgroundImage = `url('${d.wall}')`;
                const h = document.getElementById('nu-hist'); h.innerHTML = "";
                if(d.historico) Object.values(d.historico).reverse().forEach(i => {
                    h.innerHTML += `<div style="padding:15px; border-bottom:1px solid #222; color:white; display:flex; justify-content:space-between;"><span>${i.label}</span><span style="color:${i.val>0?'#00ff00':'#fff'}">R$ ${i.val.toFixed(2)}</span></div>`;
                });
            });
            onValue(ref(db, 'usuarios'), s => {
                const l = document.getElementById('contatos'); l.innerHTML = "";
                s.forEach(u => { if(u.key !== GTR.user) l.innerHTML += `<div style="padding:15px; border-bottom:1px solid #222; color:white;" onclick="GTR.openChat('${u.key}')"><b>${u.key}</b></div>`; });
            });
        }
    };
    window.onload = GTR.init;
</script>
</body>
</html>
